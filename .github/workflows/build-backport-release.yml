name: build-reviewed-backport-release

on:
  workflow_dispatch:
    inputs:
      upstream_image:
        description: 'Immutable official image, docker.io/nousresearch/hermes-agent@sha256:...'
        required: true
        type: string
      release_notes:
        description: 'Short review/testing note for this draft'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate reviewed patch set and immutable image input
        env:
          UPSTREAM_IMAGE: ${{ inputs.upstream_image }}
        run: |
          python scripts/patchctl.py validate
          case "$UPSTREAM_IMAGE" in
            docker.io/nousresearch/hermes-agent@sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo 'upstream_image must be the official repository pinned to a full sha256 digest'; exit 1 ;;
          esac
          python - <<'PY'
          import json
          manifest=json.load(open('patches/manifest.json', encoding='utf-8'))
          assert any(p.get('enabled') and p.get('status') == 'approved' for p in manifest['patches']), 'no approved enabled patch'
          PY

      - name: Read upstream version
        id: version
        run: |
          python - <<'PY'
          import json, os
          u=json.load(open('upstream.json', encoding='utf-8'))
          tag=u['tag'].removeprefix('v')
          release=f"v{tag}-backport.{u['backportVersion']}"
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"tag={release}\nsource_sha={u['commitSha']}\nupstream_tag={u['tag']}\nbackport={u['backportVersion']}\n")
          PY

      - name: Clone and verify official source
        run: |
          git clone --depth 1 --branch '${{ steps.version.outputs.upstream_tag }}' \
            https://github.com/NousResearch/hermes-agent.git .work/hermes-agent
          test "$(git -C .work/hermes-agent rev-parse HEAD)" = '${{ steps.version.outputs.source_sha }}'

      - name: Apply reviewed patches with original authorship
        run: python scripts/patchctl.py apply .work/hermes-agent

      - name: Run upstream and backport tests
        run: |
          python -m unittest discover -s tests -v
          python -m pip install --disable-pip-version-check uv==0.11.6
          cd .work/hermes-agent
          uv sync --frozen --extra dev
          uv run pytest tests/hermes_cli/test_web_profile_soul_writes.py -q
          uv run pytest tests/test_tui_gateway_server.py -q -k \
            'profile_home_isolated_default_resolves_to_launch_profile or process_is_profile_scoped_detects_scoped_home'

      - name: Build patched source archive
        run: |
          mkdir -p dist
          tar --exclude='.git' -C .work -czf "dist/hermes-agent-${{ steps.version.outputs.tag }}-source.tar.gz" hermes-agent

      - name: Prepare fast official-image overlay
        run: |
          python scripts/prepare_overlay.py .work/hermes-agent .work/overlay \
            --base-sha '${{ steps.version.outputs.source_sha }}'
          cp container/Dockerfile.overlay .work/overlay/Dockerfile

      - name: Build and smoke-test derived image
        env:
          UPSTREAM_IMAGE: ${{ inputs.upstream_image }}
        run: |
          docker build \
            --build-arg UPSTREAM_IMAGE="$UPSTREAM_IMAGE" \
            --build-arg UPSTREAM_SOURCE_SHA='${{ steps.version.outputs.source_sha }}' \
            --build-arg BACKPORT_VERSION='${{ steps.version.outputs.backport }}' \
            -t 'hermes-agent:${{ steps.version.outputs.tag }}' .work/overlay
          docker run --rm 'hermes-agent:${{ steps.version.outputs.tag }}' --version
          # Docker layer blobs are already compressed; level 1 avoids spending
          # several CI minutes for negligible additional size reduction.
          docker save 'hermes-agent:${{ steps.version.outputs.tag }}' | gzip -1 > \
            'dist/hermes-agent-${{ steps.version.outputs.tag }}-linux-amd64.docker.tar.gz'

      - name: Package provenance and checksums
        env:
          UPSTREAM_IMAGE: ${{ inputs.upstream_image }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          cp upstream.json patches/manifest.json dist/
          cp patches/enabled/*.patch dist/
          python - <<'PY'
          import os
          from pathlib import Path
          tag=os.environ['RELEASE_TAG']
          text=Path('docs/RELEASE-USAGE.md').read_text(encoding='utf-8')
          text=text.replace('@VERSION@', tag)
          text=text.replace('@DOCKER_ARCHIVE@', f'hermes-agent-{tag}-linux-amd64.docker.tar.gz')
          text=text.replace('@SOURCE_ARCHIVE@', f'hermes-agent-{tag}-source.tar.gz')
          Path('dist/USAGE.md').write_text(text, encoding='utf-8')
          PY
          python scripts/watch_upstream.py
          cp upstream-status.json dist/
          python - <<'PY'
          import datetime, json, os
          p={
            'generatedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'workflowRun': os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],
            'upstreamImage': os.environ['UPSTREAM_IMAGE'],
            'releaseNotes': os.environ['RELEASE_NOTES'],
          }
          open('dist/provenance.json','w',encoding='utf-8').write(json.dumps(p,indent=2)+'\n')
          PY
          cd dist
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: reviewed-backport-${{ steps.version.outputs.tag }}
          path: dist/

      - name: Create immutable draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ steps.version.outputs.tag }}'
          test -z "$(gh release list --json tagName --jq ".[] | select(.tagName == \"$tag\") | .tagName")" || \
            { echo "release $tag already exists; bump backportVersion instead of replacing artifacts"; exit 1; }
          gh release create "$tag" dist/* --draft \
            --title "Hermes Agent $tag" \
            --notes-file dist/USAGE.md
