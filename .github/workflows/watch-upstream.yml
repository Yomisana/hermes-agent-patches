name: watch-hermes-upstream

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Query tracked upstream state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/watch_upstream.py
      - uses: actions/upload-artifact@v7
        with:
          name: upstream-status-${{ github.run_id }}
          path: upstream-status.json
          retention-days: 30

